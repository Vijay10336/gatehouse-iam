spring.application.name=gatehouse
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15433/gatehouse}
spring.datasource.username=${DATABASE_USER:gatehouse}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.threads.virtual.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.name=GATEHOUSE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=native
server.tomcat.max-http-form-post-size=32KB
server.error.include-message=never
spring.mail.host=${SMTP_HOST:mail}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.issuer=${PUBLIC_ISSUER:http://localhost:18100}
app.key-encryption-secret=${KEY_ENCRYPTION_SECRET}
app.bootstrap-email=${BOOTSTRAP_ADMIN_EMAIL:admin@gatehouse.local}
app.bootstrap-password=${BOOTSTRAP_ADMIN_PASSWORD}
app.demo-client-secret=${DEMO_CLIENT_SECRET}
app.mail-from=${MAIL_FROM:identity@gatehouse.local}
